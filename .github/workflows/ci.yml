name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knightlink
          POSTGRES_PASSWORD: knightlink
          POSTGRES_DB: knightlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: knightlink
      PGPASSWORD: knightlink
      PGDATABASE: knightlink
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build server
        run: pnpm --filter server build

      - name: Server unit tests
        run: pnpm --filter server test

      - name: Server integration tests
        run: pnpm --filter server test:integration

      - name: Client tests
        run: pnpm --filter client test

      - name: Build client
        run: pnpm --filter client build
